[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scar"
version = "0.1.0"
description = "Stored Corrections And Recall — HydraDB correction graph"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scar = "scar.cli:main"
scar-ingest = "scar.ingest.cli:main"

[tool.setuptools.packages.find]
include = ["scar*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that require a live HydraDB graph-node",
]
